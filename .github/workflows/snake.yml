name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#e7e7e7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e7e7e7

      - name: Skip Vercel deployments for the generated output branch
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          mkdir -p dist/spotify-now-playing
          printf '%s\n' '{"git":{"deploymentEnabled":{"output":false}}}' > dist/spotify-now-playing/vercel.json
          cp dist/spotify-now-playing/vercel.json dist/vercel.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
